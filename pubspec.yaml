name: liraza
description: "AI-powered mental health support app with mood tracking and therapist directory"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_analytics: ^11.3.3

  # Google Services
  google_sign_in: ^6.2.1
  # google_maps_flutter: ^2.9.0  # Removed for web compatibility
  google_generative_ai: ^0.4.6
  url_launcher: ^6.3.1
  # geolocator: ^13.0.2  # Removed for web compatibility
  # geocoding: ^3.0.0  # Removed for web compatibility

  # State Management
  flutter_riverpod: ^2.6.1

  # UI & Charts
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  supabase_flutter: ^2.12.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
